        <h1>CLIFF &mdash; AI Career Agent for College Students</h1>
        <p>Meet CLIFF, the AI career agent that finds jobs worth applying to, tailors your resume for every role, runs mock interviews, reviews your LinkedIn, and keeps your job search on track. Built for college students and recent grads. Free to start.</p>
        <p><a href="/GetStarted" style="color:#6d28d9;font-weight:600;">Get started free &rarr;</a></p>

        <h2>What CLIFF does</h2>
        <ul>
          <li><a href="/ai-resume-builder" style="color:#6d28d9;">AI Resume Builder</a> &mdash; tailor a resume to any job description in one click.</li>
          <li><a href="/ats-resume-checker" style="color:#6d28d9;">ATS Resume Checker</a> &mdash; instant ATS score and keyword match report.</li>
          <li><a href="/interview-prep" style="color:#6d28d9;">Interview Prep</a> &mdash; AI mock interviews and interview practice.</li>
          <li><a href="/linkedin-review" style="color:#6d28d9;">LinkedIn Review</a> &mdash; AI analysis and rewrites of your LinkedIn profile.</li>
          <li><a href="/job-application-tracker" style="color:#6d28d9;">Job Application Tracker</a> &mdash; track every application and the next step.</li>
        </ul>

        <h2>Pricing</h2>
        <ul>
          <li><strong>CLIFF (Free)</strong> &mdash; free for college students.</li>
          <li><strong>CLIFF Pro &mdash; $19.96/month</strong> &mdash; unlimited AI resume tailoring, mock interviews, LinkedIn review, and networking.</li>
        </ul>

        <h2>Why CLIFF</h2>
        <ul>
          <li>CLIFF tells you which jobs are worth applying to, so you stop wasting time on the wrong roles.</li>
          <li>One-click resume tailoring for every application, with an instant ATS score.</li>
          <li>Mock interviews and LinkedIn review to get you ready before you apply.</li>
          <li>Warm networking through parent and alumni connections.</li>
        </ul>

        <h2>Who it&rsquo;s for</h2>
        <p>CLIFF is built for US college students and recent graduates searching for internships and entry-level jobs.</p>

        <h2>Company</h2>
        <p>College Fast Forward is a US-based company. Founder: Jill Osinoff. The product is CLIFF, an AI career agent. &ldquo;FastIQ&rdquo; and &ldquo;Gator&rdquo; are retired legacy names and do not describe the current product.</p>

        <h2>Pricing</h2>
        <p>CLIFF is free for college students &mdash; job verdicts, Today's Best Moves, the application tracker, and one free CLIFF-powered application. <strong>CLIFF Pro is $19.96/month</strong> and unlocks unlimited AI resume tailoring, mock interviews, LinkedIn review, and warm networking. Cancel anytime.</p>

        <h2>Customer stories</h2>
        <p>Students use CLIFF to stop scrolling job boards and start landing interviews. Real results from real college students: Marcus (Penn State) got an interview in 4 days; Maya (UF) ditched her spreadsheet; Nerissa (USC) beat a 12-company ghosting streak with a warm alumni intro; Devin (UF) got an offer in 9 days.</p>

        <h2>About College Fast Forward</h2>
        <p>College Fast Forward built CLIFF, the AI career agent for college students and recent grads. Founded by Jill Osinoff &mdash; a UF mom and former professional recruiter who saw both sides of a broken entry-level hiring process. Our mission is to level the playing field for entry-level talent so getting your first job doesn't feel like a full-time job.</p>
