<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Force SEO title/OG overrides in case the app name is injected at runtime -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        document.title = 'AI Career Agent for College Students | College Fast Forward';
        var ogTitle = document.querySelector('meta[property="og:title"]');
        if (ogTitle) ogTitle.setAttribute('content', 'AI Career Agent for College Students | College Fast Forward');
        var twTitle = document.querySelector('meta[name="twitter:title"]');
        if (twTitle) twTitle.setAttribute('content', 'AI Career Agent for College Students | College Fast Forward');
      });
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z7KEL61F0C"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-Z7KEL61F0C');
    </script>

    <link rel="icon" type="image/png" href="https://media.base44.com/images/public/684474c5723dc90efce23588/5181e2c8e_generated_image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <link rel="manifest" href="/manifest.json" />
    <title>AI Career Agent for College Students | College Fast Forward</title>
    <meta name="description" content="Meet CLIFF — the AI career agent that finds jobs worth applying to, tailors your resume for every role, and keeps you on track. Built for college students and recent grads." />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://collegefastforward.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://collegefastforward.com/" />
    <meta property="og:title" content="AI Career Agent for College Students | College Fast Forward" />
    <meta property="og:description" content="Meet CLIFF — the AI career agent that finds jobs worth applying to, tailors your resume for every role, and keeps you on track." />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI Career Agent for College Students | College Fast Forward" />
    <meta name="twitter:description" content="Meet CLIFF — the AI career agent that finds jobs worth applying to, tailors your resume for every role, and keeps you on track." />

    <!-- Force light background during full-page loads (prevents black flash on logout in dark mode) -->
    <meta name="color-scheme" content="light" />
    <style>
      html, body { background-color: #f8f9ff; }
    </style>

    <!-- Structured data for crawlers and AI marketing tools: operator, product, pricing, FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "College Fast Forward",
      "url": "https://collegefastforward.com",
      "logo": "https://media.base44.com/images/public/684474c5723dc90efce23588/5181e2c8e_generated_image.png",
      "description": "College Fast Forward builds CLIFF, an AI career agent for college students and recent grads.",
      "founder": { "@type": "Person", "name": "Jill Osinoff" },
      "foundingLocation": { "@type": "Place", "address": { "@type": "PostalAddress", "addressCountry": "US" } },
      "areaServed": { "@type": "Place", "address": { "@type": "PostalAddress", "addressCountry": "US" } }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "CLIFF",
      "applicationCategory": "EducationApplication",
      "operatingSystem": "Web",
      "url": "https://collegefastforward.com",
      "description": "AI career agent for college students: AI resume builder, ATS resume checker, interview prep, LinkedIn review, and job application tracking.",
      "offers": {
        "@type": "Offer",
        "name": "CLIFF Pro",
        "price": "19.96",
        "priceCurrency": "USD",
        "url": "https://collegefastforward.com"
      },
      "featureList": [
        "AI resume builder tailored to each job description",
        "ATS resume checker with keyword match report",
        "AI mock interviews and interview prep",
        "LinkedIn profile review",
        "Job application tracker",
        "Warm networking via parent and alumni connections"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        { "@type": "Question", "name": "What is CLIFF?", "acceptedAnswer": { "@type": "Answer", "text": "CLIFF is an AI career agent for college students and recent grads. It finds jobs worth applying to, tailors your resume to each role, runs mock interviews, reviews your LinkedIn, and tracks your applications." } },
        { "@type": "Question", "name": "Is CLIFF free?", "acceptedAnswer": { "@type": "Answer", "text": "CLIFF is free for college students. CLIFF Pro is $19.96/month and unlocks unlimited AI resume tailoring, mock interviews, LinkedIn review, and networking." } },
        { "@type": "Question", "name": "Who is CLIFF for?", "acceptedAnswer": { "@type": "Answer", "text": "CLIFF is built for college students and recent graduates searching for internships and entry-level jobs." } },
        { "@type": "Question", "name": "Where is College Fast Forward based?", "acceptedAnswer": { "@type": "Answer", "text": "College Fast Forward is a US-based company. CLIFF is built for US college students and recent grads." } }
      ]
    }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

</html>
